<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema DGSE - Multiusuario Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12" onload="initApp()">

    <!-- MODAL CONFIGURACIÓN -->
    <div id="driveConfigModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <h2 class="text-lg font-bold mb-2 text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-server text-blue-600"></i> Configurar Servidor Apps Script
            </h2>
            <p class="text-xs text-slate-500 mb-4">Ingresa la URL del Web App de Google Apps Script.</p>
            <div class="space-y-3">
                <input type="text" id="inputScriptUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full border p-2 rounded-lg text-xs font-mono">
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" onclick="closeDriveConfigModal()" class="px-3 py-1.5 border rounded-lg text-xs">Cancelar</button>
                <button type="button" onclick="saveDriveConfig()" class="px-4 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-semibold">Guardar</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl text-center border border-slate-700 relative">
            <button onclick="openDriveConfigModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xs" title="Configurar Servidor">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            <h2 class="text-xl font-bold text-slate-800 mt-4">DIRECCIÓN GENERAL DE SEGURIDAD</h2>
            <p class="text-xs text-slate-500 mb-6 uppercase tracking-wider font-semibold">Sistema de Control Multiusuario</p>
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Usuario</label>
                    <input type="text" id="loginUser" required placeholder="Ej. admin" class="w-full border p-2.5 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Contraseña</label>
                    <input type="password" id="loginPass" required placeholder="••••••••" class="w-full border p-2.5 rounded-lg text-sm">
                </div>
                <button type="submit" id="btnLoginSubmit" class="w-full bg-blue-700 hover:bg-blue-600 text-white font-bold py-2.5 rounded-lg transition shadow">
                    Ingresar al Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="appScreen" class="hidden">
        <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-lg font-bold">DIRECCIÓN GENERAL DE SEGURIDAD</h1>
                <div class="flex items-center space-x-3">
                    <span id="userInfo" class="text-xs bg-slate-800 px-3 py-1.5 rounded-full text-slate-300"></span>
                    <button onclick="openDriveConfigModal()" class="bg-slate-800 text-blue-300 px-3 py-1.5 rounded-lg text-xs"><i class="fa-solid fa-gear mr-1"></i> Servidor</button>
                    <button onclick="handleLogout()" class="text-slate-400 hover:text-white text-xs px-2 py-1"><i class="fa-solid fa-right-from-bracket text-base"></i></button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 mt-6">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 mb-6">
                <h2 class="text-xl font-bold text-slate-800 mb-2">Registro General de Notas</h2>
                <p class="text-xs text-slate-500">Total de registros: <span id="metricTotal" class="font-bold text-slate-700">0</span></p>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
                <table class="w-full text-left text-xs md:text-sm">
                    <thead class="bg-slate-800 text-white uppercase text-xs">
                        <tr>
                            <th class="p-3">Fecha</th>
                            <th class="p-3">Promotor</th>
                            <th class="p-3">Nro. de Nota</th>
                            <th class="p-3">Referencia</th>
                            <th class="p-3">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-200"></tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let SCRIPT_URL = localStorage.getItem('dgse_script_url') || '';
        let currentUser = JSON.parse(sessionStorage.getItem('activeUser')) || null;
        let authToken = sessionStorage.getItem('authToken') || '';
        let notas = [];

        function openDriveConfigModal() {
            document.getElementById('inputScriptUrl').value = SCRIPT_URL;
            document.getElementById('driveConfigModal').classList.remove('hidden');
        }
        function closeDriveConfigModal() { document.getElementById('driveConfigModal').classList.add('hidden'); }
        function saveDriveConfig() {
            SCRIPT_URL = document.getElementById('inputScriptUrl').value.trim();
            localStorage.setItem('dgse_script_url', SCRIPT_URL);
            closeDriveConfigModal();
            alert('URL del servidor guardada correctamente.');
        }

        async function initApp() {
            if (!SCRIPT_URL) {
                openDriveConfigModal();
                return;
            }
            if (currentUser && authToken) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appScreen').classList.remove('hidden');
                document.getElementById('userInfo').innerHTML = `<i class="fa-solid fa-user-shield mr-1.5 text-blue-400"></i> ${currentUser.name} (${currentUser.role})`;
                await loadServerData();
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
                document.getElementById('appScreen').classList.add('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            if (!SCRIPT_URL) {
                alert('Debe configurar la URL del servidor Apps Script primero.');
                openDriveConfigModal();
                return;
            }
            
            const btn = document.getElementById('btnLoginSubmit');
            btn.innerText = "Verificando acceso...";
            btn.disabled = true;

            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', user: u, pass: p })
                });
                const res = await response.json();
                
                if (res.status === 'success') {
                    authToken = res.token;
                    currentUser = res.user;
                    sessionStorage.setItem('authToken', authToken);
                    sessionStorage.setItem('activeUser', JSON.stringify(currentUser));
                    initApp();
                } else {
                    alert(res.message || 'Credenciales incorrectas.');
                }
            } catch (err) {
                alert('Error de conexión con el servidor. Verifique la URL de Apps Script.');
                console.error(err);
            } finally {
                btn.innerText = "Ingresar al Sistema";
                btn.disabled = false;
            }
        }

        function handleLogout() {
            sessionStorage.clear();
            currentUser = null;
            authToken = '';
            initApp();
        }

        async function loadServerData() {
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getInitialData', token: authToken })
                });
                const res = await response.json();
                if (res.status === 'success') {
                    notas = res.notas || [];
                    renderTable();
                } else if (res.status === 'error') {
                    alert(res.message);
                    handleLogout();
                }
            } catch (e) {
                console.error('Error al sincronizar datos', e);
            }
        }

        function renderTable() {
            const body = document.getElementById('tableBody');
            body.innerHTML = '';
            if (notas.length === 0) {
                body.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No hay registros en el servidor.</td></tr>`;
                document.getElementById('metricTotal').innerText = 0;
                return;
            }
            notas.forEach(n => {
                body.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3">${n.fecha || '-'}</td>
                        <td class="p-3 font-bold">${n.promotor || '-'}</td>
                        <td class="p-3 text-blue-900 font-bold">${n.nroNota || '-'}</td>
                        <td class="p-3">${n.referencia || '-'}</td>
                        <td class="p-3"><span class="px-2 py-1 bg-yellow-100 text-yellow-800 rounded-full text-xs font-bold">${n.estado || 'Pendiente'}</span></td>
                    </tr>
                `;
            });
            document.getElementById('metricTotal').innerText = notas.length;
        }
    </script>
</body>
</html>
